<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 5: Φύλλα Εργασίας και Εκπαιδευτικές Μέθοδοι</title>
    <style>
        body {font-family: 'Comfortaa', sans-serif; background-color: black; color: #fff; text-align: center; margin: 0; padding: 0;}
        h1 {background-color: black; color: gold; padding: 20px; font-size: 25px;}
        .creator, .director {background-color: black; color: gold; padding: 10px; font-size: 18px;}
        .emojis {font-size: 30px; margin-top: 20px;}
        .score-box {position: absolute; top: 20px; right: 20px; font-size: 20px; font-weight: bold;}
        .question-container {margin: 30px; max-width: 800px; margin: auto; text-align: left;}
        .question {margin: 15px 0; padding: 15px; font-size: 120%; background-color: #0b3d91; color: gold; border-radius: 10px; font-weight: bold; text-shadow: 1px 1px 0 rgba(0,0,0,0.8), -1px -1px 0 rgba(255,255,255,0.2);}
        .question-number {text-decoration: underline; display: block; margin-bottom: 5px;}
        .answer {font-size: 18px; margin: 5px 0; padding: 10px; border-radius: 5px; cursor: pointer; background-color: #777; color: white; border: none; width: 100%;}
        .answer:hover {background-color: #999;}
        .correct {background-color: green !important;}
        .incorrect {background-color: red !important;}
        .final-score {font-size: 24px; color: gold; margin-top: 20px;}
    </style>
</head>
<body>
    <div class="creator">Δημιουργία/Επιμέλεια: Παναγιώτης Δόμβρος (CC BY-NC)</div>
    <div class="director">Εκπαιδευτικός Αγγλικών - Θεατρολόγος</div>
    <div class="director">Επιμορφωτής Τ.Π.Ε</div>
    <div class="director">Διευθυντής 1ου Γυμνασίου Πυλαίας</div>
    <h1>Quiz 5: Φύλλα Εργασίας και Εκπαιδευτικές Μέθοδοι</h1>
    <div class="emojis">📝 ✏️ 🎨 🖥️</div>
    <div class="score-box">Σκορ: <span id="score">0</span> / 100</div>
    <div class="question-container" id="question-container"></div>
    <audio id="successAudio" src="success-sound.mp3"></audio>
    <audio id="failAudio" src="fail-sound.mp3"></audio>
    <script>
        const questions = [
            {q:'Ποιο είναι το πρώτο βήμα στον σχεδιασμό ενός φύλλου εργασίας;', a:['α) Επιλογή εργαλείων παραγωγής','β) Ανάλυση αναγκών','γ) Δοκιμαστική εφαρμογή'], c:1},
            {q:'Σε ποια κατηγορία δεν ανήκει ένα φύλλο εργασίας;', a:['α) Αυτοαξιολογητικό','β) Ψυχαγωγικό χωρίς μαθησιακό στόχο','γ) Προσανατολισμένο σε project'], c:1},
            {q:'Ποιο στοιχείο βοηθάει στη σαφή διάταξη ενός φύλλου εργασίας;', a:['α) Ομοιόμορφη χρήση γραμματοσειράς χωρίς υπογραμμίσεις','β) Καθαρή χωροταξική τοποθέτηση των κειμενικών στοιχείων','γ) Αποφυγή χρήσης εικόνων'], c:1},
            {q:'Ποιος τύπος δραστηριότητας εντάσσεται στα λειτουργικά στοιχεία μάθησης;', a:['α) Πολυτροπικό infographic','β) Κλειστού τύπου ερωτήσεις (multiple choice)','γ) Διακόσμηση με εικονίδια'], c:1},
            {q:'Σε ποιο βήμα καθορίζεται το επίπεδο δυσκολίας του φύλλου εργασίας;', a:['α) Βήμα 2ο: Καθορισμός στόχων','β) Βήμα 3ο: Επιλογή είδους','γ) Βήμα 4ο: Επιλογή περιεχομένου'], c:0},
            {q:'Τι σημαίνει «πολυτροπικότητα» σε ένα φύλλο εργασίας;', a:['α) Χρήση πολλών χρωμάτων','β) Συνδυασμός κειμένου, εικόνας, ήχου κ.λπ.','γ) Περιορισμός στο κείμενο μόνο'], c:1},
            {q:'Ποιο από τα παρακάτω δεν είναι παραδοσιακό εργαλείο παραγωγής φύλλων εργασίας;', a:['α) Φωτοτυπικά μηχανήματα','β) Google Docs','γ) Audacity'], c:2},
            {q:'Ποιο στοιχείο δεν ανήκει στα κειμενικά στοιχεία;', a:['α) Οδηγίες','β) Εικονίδια','γ) Λεζάντες εικονογραφήσεων'], c:1},
            {q:'Ποιο είναι ένα παράδειγμα εργαλείου ψηφιακής παραγωγής;', a:['α) LibreOffice','β) PowerPoint','γ) Τύπωμα έγχρωμων αντιγράφων σε φωτοτυπικό'], c:1},
            {q:'Ποιος είναι βασικός σκοπός της δοκιμαστικής εφαρμογής;', a:['α) Δημιουργία εικαστικών προτύπων','β) Συλλογή σχολίων για αναθεώρηση','γ) Εκτύπωση σε έγχρωμο και ασπρόμαυρο'], c:1},
            {q:'Τι υποστηρίζουν τα infographics σε ένα φύλλο εργασίας;', a:['α) Αλλοιώνουν την προσοχή','β) Διευκολύνουν την κατανόηση γραμματικών δομών','γ) Υπερφορτώνουν το κείμενο'], c:1},
            {q:'Ποια δραστηριότητα ενισχύει την αυτοαξιολόγηση;', a:['α) Αντιστοίχιση εικόνων','β) Κουίζ σωστό/λάθος','γ) Δημιουργία podcast'], c:1},
            {q:'Σε τι βοηθάει η διαφοροποίηση στις δραστηριότητες;', a:['α) Στη μείωση του χρόνου διδασκαλίας','β) Στην κάλυψη διαφορετικών αναγκών μαθητών','γ) Στην αισθητική του φύλλου εργασίας'], c:1},
            {q:'Τι απαιτείται για τη χρήση ψηφιακού φύλλου εργασίας;', a:['α) Υψηλό ψηφιακό γραμματισμό μόνο','β) Πρόσβαση σε ψηφιακούς πόρους','γ) Μεταφορά σε έντυπη μορφή'], c:1},
            {q:'Ποια χρώματα χρησιμοποιούνται συνήθως σε έντυπα φύλλα εργασίας;', a:['α) Πάντα έγχρωμα','β) Σπανίως, λόγω κόστους','γ) Ποτέ, μόνο ασπρόμαυρα'], c:1},
            {q:'Ποια είναι η λειτουργία των υπέρτιτλων;', a:['α) Διακόσμηση σελίδας','β) Οργάνωση και αναφορά ακολουθίας','γ) Παράθεση παραδειγμάτων'], c:1},
            {q:'Τι υποδεικνύει ένα αυτοαξιολογητικό κουίζ;', a:['α) Αντίγραφο του κύριου βιβλίου','β) Στοιχείο ανατροφοδότησης','γ) Κεφάλαιο διηγήματος'], c:1},
            {q:'Ποια είναι η σχέση κειμένου και εικόνας σε ένα πολυτροπικό φύλλο;', a:['α) Είναι ανεξάρτητα','β) Συμπληρώνουν το ένα το άλλο','γ) Ανταγωνίζονται για την προσοχή'], c:1},
            {q:'Σε ποιο βήμα επιλέγεται το σύνολο των δραστηριοτήτων;', a:['α) Βήμα 1ο','β) Βήμα 3ο','γ) Βήμα 5ο'], c:1},
            {q:'Τι υποστηρίζει η βιβλιογραφική έρευνα για τα φύλλα εργασίας;', a:['α) Ότι δεν χρειάζονται προδιαγραφές','β) Την σημασία του θεωρητικού πλαισίου','γ) Την αποκλειστική χρήση ψηφιακών εργαλείων'], c:1},
            {q:'Ποιο στοιχείο προσφέρει ανατροφοδότηση άμεσα;', a:['α) Glossary','β) Αυτοαξιολογητική δοκιμασία','γ) Διευκρινιστικές σημειώσεις'], c:1},
            {q:'Τι συμβάλλει στην αισθητική ενός φύλλου εργασίας;', a:['α) Αποφυγή διαγραμμάτων','β) Επιμελημένη χρήση χρωμάτων και γραμματοσειρών','γ) Πυκνό κείμενο χωρίς κενά'], c:1},
            {q:'Ποια δραστηριότητα ενισχύει την συνεργασία;', a:['α) Μονομερής γραπτή άσκηση','β) Ομαδικό project','γ) Αυτόνομη ανάγνωση'], c:1},
            {q:'Τι μπορεί να λειτουργήσει ως υπόδειγμα παιγνιώδους δραστηριότητας;', a:['α) Πίνακας λέξεων','β) Φύλλο εργασίας copy-paste','γ) Μαθηματική άσκηση'], c:0},
            {q:'Σε ποια περίπτωση χρησιμοποιούμε remedial exercises;', a:['α) Όταν όλοι οι μαθητές έχουν υψηλή ετοιμότητα','β) Όταν κάποιοι χρειάζονται επιπλέον βοήθεια','γ) Όταν το φύλλο είναι ψηφιακό'], c:1},
            {q:'Τι είναι η διαφοροποιημένη διδασκαλία;', a:['α) Διδασκαλία με έναν τρόπο για όλους','β) Προσαρμογή πρακτικών στις ανάγκες κάθε μαθητή','γ) Χρήση μόνο ψηφιακών μέσων'], c:1},
            {q:'Ποια στρατηγική ανήκει στη διαφοροποίηση περιεχομένου;', a:['α) Ευέλικτη ομαδοποίηση','β) Κλιμακούμενη δυσκολία','γ) Διαδραστικός πίνακας'], c:1},
            {q:'Ποιος είναι ρόλος του εκπαιδευτικού στο PBL;', a:['α) Κεντρικός ομιλητής','β) Διευκολυντής της έρευνας','γ) Απλός θεατής'], c:1},
            {q:'Τι χαρακτηρίζει την ανεστραμμένη τάξη;', a:['α) Διδασκαλία μόνο σε αίθουσα','β) Μαθησιακό υλικό στο σπίτι, δραστηριότητες στην τάξη','γ) Απουσία ψηφιακών πόρων'], c:1},
            {q:'Ποια φάση δεν ανήκει σε ένα project;', a:['α) Υλοποίηση','β) Παρουσίαση','γ) Τυπική αξιολόγηση χωρίς αναστοχασμό'], c:2},
            {q:'Τι εννοούμε με τον όρο «εισιτήριο ετοιμότητας»;', a:['α) Εισαγωγικό βίντεο','β) Διαγνωστικό τεστ','γ) Τελικές εξετάσεις'], c:1},
            {q:'Ποια τεχνολογία εξυπηρετεί την πολυαισθητηριακή μάθηση;', a:['α) E-book','β) Σελιδοδείκτης','γ) Μολύβι'], c:0},
            {q:'Τι υποστηρίζει η διερευνητική προσέγγιση;', a:['α) Παθητική απομνημόνευση','β) Ενεργητική διατύπωση ερωτημάτων','γ) Αυτόνομη διόρθωση'], c:1},
            {q:'Ποια διαδικασία χαρακτηρίζει το tiered lesson;', a:['α) Ίδιες δραστηριότητες για όλους','β) Διαφορετικά καθήκοντα σε ίδιο θέμα','γ) Απουσία αξιολόγησης'], c:1},
            {q:'Ποια εφαρμογή δεν ανήκει στα Web 2.0 εργαλεία;', a:['α) Padlet','β) Mentimeter','γ) Audacity'], c:2},
            {q:'Τι προσφέρει η ανεστραμμένη μάθηση στην τάξη;', a:['α) Μειωμένη συμμετοχή','β) Περισσότερο χρόνο για ενεργητικές δραστηριότητες','γ) Καλύτερη εκτύπωση υλικού'], c:1},
            {q:'Ποιο είναι πλεονέκτημα του PBL;', a:['α) Εστίαση σε αποστήθιση','β) Ανάπτυξη δεξιοτήτων επίλυσης προβλημάτων','γ) Περιορισμένες ομάδες εργασίας'], c:1},
            {q:'Σε ποιο κεφάλαιο συζητείται ο ρόλος της AI στην εκπαίδευση;', a:['α) 5.2','β) 5.4','γ) 5.6'], c:2},
            {q:'Τι σημαίνει flexible grouping;', a:['α) Μόνιμες ομάδες','β) Δυναμικές, εναλλασσόμενες ομάδες','γ) Ατομική εργασία'], c:1},
            {q:'Ποια μέθοδος ενθαρρύνει την κριτική σκέψη;', a:['α) Παραδοσιακή διάλεξη','β) Διερευνητική προσέγγιση','γ) Επαναλαμβανόμενα κουίζ'], c:1},
            {q:'Ποιο από τα παρακάτω είναι εργαλείο για concept mapping;', a:['α) Kidspiration','β) Audacity','γ) PowerPoint'], c:0},
            {q:'Τι προσφέρουν τα podcasts στην ξενόγλωσση τάξη;', a:['α) Μόνο γραπτό λόγο','β) Ακουστική εξάσκηση','γ) Καμία διαφοροποίηση'], c:1},
            {q:'Ποια φάση δεν ανήκει στην εφαρμογή της ανεστραμμένης τάξης;', a:['α) Προετοιμασία υλικού για το σπίτι','β) Απομνημόνευση εντός τάξης','γ) Ενεργητικές δραστηριότητες στην τάξη'], c:1},
            {q:'Ποιο στοιχείο δεν είναι χαρακτηριστικό της AI στην εκπαίδευση;', a:['α) Chatbots για πρακτική ομιλίας','β) Αυτόματη ανατροφοδότηση','γ) Αποκλειστική χρήση έντυπου βιβλίου'], c:2},
            {q:'Ποιο είναι κύριο πλεονέκτημα των LMS;', a:['α) Χωρίς δυνατότητα συνεργασίας','β) Δημιουργία συνεργατικών χώρων μάθησης','γ) Απαγορεύουν την πρόσβαση εξ αποστάσεως'], c:1},
            {q:'Τι υποστηρίζει η «δημοκρατικοποίηση» της τεχνολογίας;', a:['α) Περιορισμένη πρόσβαση μαθητών','β) Ελεύθερη χρήση ψηφιακών μέσων από όλους','γ) Αποκλειστικά ατομική μάθηση'], c:1},
            {q:'Ποιο είναι το βασικό όφελος των ψηφιακών αφισών στο tiered lesson;', a:['α) Ελάχιστη συμμετοχή','β) Δημιουργία κοινού πόρου για όλους','γ) Απλοποιημένη αξιολόγηση'], c:1},
            {q:'Τι σημαίνει «αυθεντικά περιβάλλοντα μάθησης»;', a:['α) Προεπιλεγμένα έντυπα τετράδια','β) Πραγματική χρήση γλώσσας σε πλαίσια καθημερινότητας','γ) Μόνο θεωρητικές ασκήσεις'], c:1},
            {q:'Ποια δραστηριότητα ανήκει στο inquiry-based learning;', a:['α) Αντιγραφή κειμένου','β) Διατύπωση ερωτήσεων και έρευνα','γ) Παθητική ακρόαση'], c:1},
            {q:'Ποιο εργαλείο υποστηρίζει την ψηφιακή αφήγηση (digital storytelling);', a:['α) Wiki','β) Blog ή vlog','γ) Χαρτί και μολύβι'], c:1}
        ];
        let score=0, idx=0;
        const container=document.getElementById('question-container');
        function showQuestion(){
            if(idx>=questions.length){
                container.innerHTML=`<div class="final-score">Τέλος! Σκορ: ${score} / ${questions.length*2}</div>`;
                return;
            }
            const {q,a} = questions[idx];
            let html=`<div class="question"><span class="question-number">Ερώτηση ${idx+1}:</span>${q}</div>`;
            a.forEach((opt,i)=>{ html+=`<button class="answer" data-index="${i}">${opt}</button>`; });
            container.innerHTML=html;
            document.querySelectorAll('.answer').forEach(btn=>btn.addEventListener('click',onAnswer));
        }
        function onAnswer(e){
            const selected=+e.currentTarget.dataset.index;
            const {c}=questions[idx];
            const audio=selected===c?document.getElementById('successAudio'):document.getElementById('failAudio');
            audio.play();
            if(selected===c) score+=2;
            document.getElementById('score').textContent=score;
            document.querySelectorAll('.answer').forEach((btn,i)=>{ btn.disabled=true; if(i===c) btn.classList.add('correct'); else if(i===selected) btn.classList.add('incorrect'); });
            idx++;
            setTimeout(showQuestion,800);
        }
        showQuestion();
    </script>
</body>
</html>
